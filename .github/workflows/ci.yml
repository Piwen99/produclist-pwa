name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Tests
        run: pnpm coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm exec playwright test

  rls:
    name: RLS isolation
    runs-on: ubuntu-latest
    # A cold runner pulls the local stack images; the tests themselves are fast.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: the local stack and `db reset` flags are CLI-version sensitive.
          version: 2.121.0

      - name: Start the local stack
        run: supabase start

      - name: Apply the migrations from scratch
        # Never `db push` and never a linked project: the production ref is
        # guarded by scripts/supabase-link-guard.mjs and CI must not reach it.
        run: supabase db reset --local

      - name: Assert RLS isolation
        run: >-
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1
          -f supabase/tests/rls_isolation.sql
